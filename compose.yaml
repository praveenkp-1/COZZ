services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: cozzy
      POSTGRES_USER: cozzy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozzy -d cozzy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
